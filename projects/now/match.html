<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trixter's Match Engine</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f0e8;
        color: #4a453e;
        padding: 16px;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        line-height: 1.5;
      }

      .container {
        width: 100%;
        max-width: 520px;
        background: #fdfaf5;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 24px rgba(74, 69, 62, 0.08);
      }

      h1 {
        font-size: 22px;
        text-align: center;
        color: #8b7355;
        margin-bottom: 4px;
        font-weight: 600;
      }

      .subtitle {
        text-align: center;
        font-size: 13px;
        color: #a89a87;
        margin-bottom: 24px;
      }

      .row {
        margin-bottom: 18px;
      }

      .row-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        gap: 8px;
      }

      label {
        font-size: 14px;
        font-weight: 500;
        color: #6b6255;
      }

      .val {
        font-size: 14px;
        font-weight: 600;
        color: #8b7355;
        white-space: nowrap;
      }

      input[type="range"] {
        width: 100%;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: #e8dfd2;
        border-radius: 3px;
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        background: #b8a88a;
        border-radius: 50%;
        cursor: pointer;
        border: 3px solid #fdfaf5;
        box-shadow: 0 1px 4px rgba(74, 69, 62, 0.2);
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #b8a88a;
        border-radius: 50%;
        cursor: pointer;
        border: 3px solid #fdfaf5;
        box-shadow: 0 1px 4px rgba(74, 69, 62, 0.2);
      }

      input[type="range"]:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .divider {
        border-top: 1px dashed #e0d5c5;
        margin: 24px 0 16px;
      }

      .sublabel {
        color: #a89a87;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 16px;
        font-weight: 600;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: #f5efe5;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 10px;
        transition: background 0.15s;
      }

      .checkbox-row:hover {
        background: #efe7d8;
      }

      .checkbox-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #b8a88a;
        cursor: pointer;
        flex-shrink: 0;
      }

      .checkbox-row label {
        cursor: pointer;
        font-size: 14px;
        user-select: none;
      }

      .checkbox-row input[type="checkbox"]:disabled + label {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-calc {
        width: 100%;
        padding: 14px;
        background: #b8a88a;
        color: #fdfaf5;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        margin-top: 16px;
        transition: background 0.15s;
        font-family: inherit;
      }

      .btn-calc:hover {
        background: #a89878;
      }

      .btn-calc:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .result-box {
        margin-top: 24px;
        text-align: center;
        border-top: 1px dashed #e0d5c5;
        padding-top: 20px;
      }

      .result-label {
        font-size: 12px;
        color: #a89a87;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
      }

      #ci_result {
        font-size: 40px;
        font-weight: 700;
        margin: 8px 0;
        color: #8b7355;
        transition: color 0.2s;
      }

      .status-msg {
        margin-top: 10px;
        font-size: 13px;
        color: #c47a7a;
        min-height: 20px;
        line-height: 1.4;
      }

      /* Mobile tweaks */
      @media (max-width: 480px) {
        body {
          padding: 10px;
        }

        .container {
          padding: 18px;
          border-radius: 12px;
        }

        h1 {
          font-size: 19px;
        }

        #ci_result {
          font-size: 34px;
        }

        .row-head {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Trixter's Match Engine</h1>
      <p class="subtitle">Индекс Совместимости v1.7</p>

      <div class="row">
        <div class="row-head">
          <label for="breast">Размер груди</label>
          <span class="val" id="breast_v"></span>
        </div>
        <input
          type="range"
          id="breast"
          min="0"
          max="6"
          oninput="updateBreast(this.value)"
        />
      </div>

      <div class="row">
        <div class="row-head">
          <label for="iq">Интеллект</label>
          <span class="val" id="iq_v"></span>
        </div>
        <input
          type="range"
          id="iq"
          min="50"
          max="160"
          oninput="updateIq(this.value)"
        />
      </div>

      <div class="divider"></div>
      <div class="sublabel">Опционально</div>

      <div class="row">
        <div class="row-head">
          <label for="age">Возраст</label>
          <span class="val" id="age_v"></span>
        </div>
        <input
          type="range"
          id="age"
          min="35"
          max="50"
          oninput="updateAge(this.value)"
        />
      </div>

      <div class="row">
        <div class="row-head">
          <label for="weight">Вес</label>
          <span class="val" id="weight_v"></span>
        </div>
        <input
          type="range"
          id="weight"
          min="35"
          max="120"
          oninput="updateWeight(this.value)"
        />
      </div>

      <div class="row">
        <div class="row-head">
          <label for="hips">Объём бёдер</label>
          <span class="val" id="hips_v"></span>
        </div>
        <input
          type="range"
          id="hips"
          min="70"
          max="140"
          oninput="updateHips(this.value)"
        />
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="botox" />
        <label for="botox">Наличие ботокса</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="masha" onchange="toggleMasha(this)" />
        <label for="masha">Меня зовут Маша Е****ва</label>
      </div>

      <button class="btn-calc" onclick="calculateCI()">
        Запустить валидацию
      </button>

      <div class="result-box">
        <div class="result-label">Индекс Совместимости</div>
        <div id="ci_result">-- %</div>
        <div id="status_msg" class="status-msg"></div>
      </div>
    </div>

    <script>
      let savedState = null;

      const MASHA_CONFIG = {
        age: 36,
        weight: 65,
        iq: 98,
        hips: 95,
        breast: -1,
      };

      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function updateAge(val) {
        document.getElementById("age_v").innerText = val + " лет";
      }

      function updateWeight(val) {
        const weightInt = parseInt(val);
        let label;
        if (weightInt <= 55) label = "Откормлю!";
        else if (weightInt >= 100) label = "Не прокормлю...";
        else label = weightInt + " кг";
        document.getElementById("weight_v").innerText = label;
      }

      function updateIq(val) {
        document.getElementById("iq_v").innerText = val + " IQ";
      }

      function updateHips(val) {
        document.getElementById("hips_v").innerText = val + " см";
      }

      function updateBreast(val) {
        const v = parseInt(val);
        document.getElementById("breast_v").innerText = v + " разм.";
      }

      function clamp(val, min, max) {
        return Math.min(Math.max(val, min), max);
      }

      function captureState() {
        const ids = ["age", "weight", "iq", "hips", "breast", "botox"];
        const state = {};
        ids.forEach((id) => {
          const el = document.getElementById(id);
          state[id] = el.type === "checkbox" ? el.checked : el.value;
        });
        return state;
      }

      function restoreState(state) {
        const setters = {
          age: updateAge,
          weight: updateWeight,
          iq: updateIq,
          hips: updateHips,
          breast: updateBreast,
        };
        Object.keys(state).forEach((id) => {
          const el = document.getElementById(id);
          if (el.type === "checkbox") {
            el.checked = state[id];
          } else {
            el.value = state[id];
            if (setters[id]) setters[id](state[id]);
          }
        });
      }

      function setLock(locked) {
        const ids = ["age", "weight", "iq", "hips", "breast", "botox"];
        ids.forEach((id) => {
          document.getElementById(id).disabled = locked;
        });
        document.querySelector(".btn-calc").disabled = locked;
      }

      function toggleMasha(checkbox) {
        const botox = document.getElementById("botox");

        if (checkbox.checked) {
          savedState = captureState();
          setLock(true);
          botox.checked = true;

          const setters = {
            age: updateAge,
            weight: updateWeight,
            iq: updateIq,
            hips: updateHips,
            breast: updateBreast,
          };
          Object.keys(MASHA_CONFIG).forEach((id) => {
            const el = document.getElementById(id);
            el.value = MASHA_CONFIG[id];
            setters[id](MASHA_CONFIG[id]);
          });

          calculateCI();
        } else {
          setLock(false);
          if (savedState) {
            restoreState(savedState);
            savedState = null;
          }
          const resultElement = document.getElementById("ci_result");
          const msgElement = document.getElementById("status_msg");
          resultElement.innerText = "-- %";
          resultElement.style.color = "#8b7355";
          msgElement.innerText = "";
        }
      }

      window.onload = function () {
        const sliders = [
          { id: "age", min: 35, max: 50, updateFn: updateAge },
          { id: "weight", min: 35, max: 120, updateFn: updateWeight },
          { id: "iq", min: 50, max: 160, updateFn: updateIq },
          { id: "hips", min: 70, max: 140, updateFn: updateHips },
          { id: "breast", min: 0, max: 6, updateFn: updateBreast },
        ];

        sliders.forEach((slider) => {
          const input = document.getElementById(slider.id);
          const randomVal = getRandomInt(slider.min, slider.max);
          input.value = randomVal;
          slider.updateFn(randomVal);
        });

        const resultElement = document.getElementById("ci_result");
        const msgElement = document.getElementById("status_msg");
        resultElement.innerText = "-- %";
        resultElement.style.color = "#8b7355";
        msgElement.innerText = "";
      };

      function calculateCI() {
        const age = parseInt(document.getElementById("age").value);
        const weight = parseInt(document.getElementById("weight").value);
        const iq = parseInt(document.getElementById("iq").value);
        const hips = parseInt(document.getElementById("hips").value);
        const breast = parseInt(document.getElementById("breast").value);
        const hasBotox = document.getElementById("botox").checked;
        const isMasha = document.getElementById("masha").checked;

        const resultElement = document.getElementById("ci_result");
        const msgElement = document.getElementById("status_msg");

        msgElement.innerText = "";

        if (isMasha) {
          resultElement.innerText = "-∞ %";
          resultElement.style.color = "#c47a7a";
          msgElement.innerText =
            "CRITICAL OVERFLOW ERROR: Обнаружен ботоксный рептилоид.";
          return;
        }

        const indicatorBtox = hasBotox ? 0 : 1;

        const baseCI =
          100 -
          2 * Math.abs(age - 40) -
          (weight - 65) +
          (iq - 100) -
          Math.max(0, Math.abs(hips - 95) - 10) +
          5 * breast;

        const finalCI = indicatorBtox * clamp(baseCI, 0, 100);

        resultElement.innerText = finalCI + "%";

        if (hasBotox || finalCI === 0) {
          resultElement.style.color = "#c47a7a";
        } else if (finalCI >= 90) {
          resultElement.style.color = "#8fa876";
        } else if (finalCI >= 60) {
          resultElement.style.color = "#c9a961";
        } else {
          resultElement.style.color = "#b8956a";
        }
      }
    </script>
  </body>
</html>
