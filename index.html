<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trixter</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        background: #0d1117;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .hero-banner {
        width: 100vw;
        height: 100vh;
        background-image: url("images/hero-path.webp");
        background-size: cover;
        background-position: center 30%;
        opacity: 0;
        animation: fadeInImage 2s ease-in-out forwards;
      }
      @keyframes fadeInImage {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero-banner"></div>
  </body>
</html>
